<div class="container mx-auto p-4">
  <h1 class="text-3xl font-bold text-blue-600">Upload Race</h1>
</div>
<div class="container mx-auto p-4">
  <form action="{% url 'races' season.season %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="file" name="file" class="file-input file-input-ghost" />
    <button type="submit" class="btn sm:btn-sm">Submit</button>
  </form>
</div>
