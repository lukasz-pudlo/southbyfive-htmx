<div class="container mx-auto p-4">
  <h1 class="text-3xl font-bold text-blue-600">Upload Race</h1>
</div>
<div class="container mx-auto p-4">
  <form action="{% url 'races' season.season %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {% if form.errors %}
      <div role="alert" class="alert alert-warning mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <ul>
          {% for field, errors in form.errors.items %}
            <li class="list-row">
              {{ error }}
            </li class="list-row">
            {% for error in errors %}
              <li class="list-row">
                {{ error }}
              </li class="list-row">
            {% endfor %}
          {% endfor %}
        </ul>
      </div>
    {% endif %}
    <input type="file" name="excel_file" class="file-input file-input-ghost" />
    <button type="submit" class="btn sm:btn-sm">Submit</button>
  </form>
</div>
