{% extends "base.html" %}
{% load datetime_filters %}

{% block content %}
  <div class="container mx-auto p-4">
    <h1 class="text-3xl font-bold text-blue-600">Seasons</h1>
  </div>
    <div class="container mx-auto p-4">
      <ul>
        {% for season in seasons %}
          <li class="text-2xl font-medium text-black"><a href="{{season.season}}">{{ season.season|format_season_name }}</a></li>
        {% endfor %}
      </ul>
    </div>

{% endblock %}
