{% extends "base.html" %}

{% block content %}
<div class="container mx-auto p-4">
    <h1 class="text-3xl font-bold text-blue-600">{{ race.get_park_display }}</h1>
</div>

<div class="container mx-auto p-4 overflow-x-auto">
  <table class="table table-zebra">
    <!-- head -->
    <thead>
      <tr>
        <th>Runner</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody>
        {% for result in results %}
        <tr>
            <th>{{ result.runner }}</th>
            <td>{{ result.time }}</td>
        </tr>
        {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
